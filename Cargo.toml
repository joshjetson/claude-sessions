[package]
name = "claude-sessions"
version = "0.1.0"
edition = "2021"
resolver = "3"
rust-version = "1.85"
license = "MIT"
description = "A live terminal dashboard for your Claude Code sessions — conversations, task board, QA pipelines, and deploys in one TUI"
repository = "https://github.com/joshjetson/claude-sessions"
homepage = "https://github.com/joshjetson/claude-sessions"
readme = "README.md"
keywords = ["claude-code", "tui", "dashboard", "ratatui", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["assets/", ".github/"]

[dependencies]
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
# Blocking HTTP for the Odoo JSON-RPC client. ureq 3 keeps the dependency tree
# small (no async runtime, and no `url` crate, whose idna/icu chain now needs
# Rust 1.88) and `native-tls` uses the platform TLS stack, so installing needs
# no cmake or nasm.
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[profile.release]
lto = true
strip = true

[dev-dependencies]
tempfile = "3"
