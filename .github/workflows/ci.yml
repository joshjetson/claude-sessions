name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Guard the promise that `cargo install claude-sessions` works WITHOUT
  # --locked: resolve dependencies fresh (no lockfile) and build. If a new
  # release of any dependency breaks us, this job goes red before a
  # teammate's install does.
  fresh-resolve:
    strategy:
      matrix:
        # stable catches new-dep breakage; 1.85 is the declared MSRV — a fresh
        # resolve must build on BOTH, because `cargo install` users resolve
        # fresh on whatever toolchain they have.
        toolchain: [stable, "1.85"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: rm Cargo.lock
      - run: cargo build --all-targets
