name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      # Every platform reports, rather than the first failure cancelling the
      # rest: a Windows-only break is invisible if a macOS lint cancels the job
      # that would have found it.
      fail-fast: false
      # Windows is experimental: it compiles and its test suite runs, with the
      # Unix-only pieces (live process discovery, the terminal drivers) gated
      # off rather than silently broken. See the Windows section of the README.
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Formatting is a property of the source, not of the platform, so one OS
      # settles it. Running it three times only adds a way for a line-ending
      # difference to fail a job that is not about formatting.
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Guard the promise that `cargo install claude-sessions` works WITHOUT
  # --locked: resolve dependencies fresh (no lockfile) and build. If a new
  # release of any dependency breaks us, this job goes red before a
  # teammate's install does.
  fresh-resolve:
    strategy:
      matrix:
        # stable catches new-dep breakage; 1.85 is the declared MSRV — a fresh
        # resolve must build on BOTH, because `cargo install` users resolve
        # fresh on whatever toolchain they have.
        toolchain: [stable, "1.85"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: rm Cargo.lock
      - run: cargo build --all-targets
